name: build linux arm64

on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build-arm64-musl:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-musl-arm64-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-musl-arm64-

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (aarch64-unknown-linux-musl, release)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target aarch64-unknown-linux-musl

      - name: Collect artifact
        run: |
          cp target/aarch64-unknown-linux-musl/release/substore substore-linux-arm64
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          prerelease: true
          files: substore-linux-arm64