[package]
name = "substore"
version = "0.1.0"
edition = "2021"
description = "Run Sub-Store backend JS in QuickJS with a Rust host, no Node.js runtime"

[dependencies]
rquickjs = { version = "0.14", features = ["futures", "macro"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
maxminddb = "0.24"
rust-embed = { version = "8", features = ["debug-embed"] }
flate2 = "1"
bytes = "1"
# 实测：mimalloc 在本场景（QuickJS 大量小对象 + 长期驻留）反而使 RSS 从 50MB 涨到 70MB，
# 且预留 1GB 虚拟地址。默认关闭，仅作为可选 feature 供其他负载复验。
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
default = []
mimalloc = ["dep:mimalloc"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
